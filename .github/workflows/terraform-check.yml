---
name: Terraform Check

"on":
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: terraform-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases packageName=opentofu/opentofu
  OPENTOFU_VERSION: 1.11.6
  # renovate: datasource=github-releases packageName=gruntwork-io/terragrunt
  TERRAGRUNT_VERSION: v1.0.2
  TG_NON_INTERACTIVE: "true"

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: terraform

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@just
      - uses: terraform-linters/setup-tflint@v6
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false
      - uses: ./.github/actions/install-terragrunt
        with:
          version: ${{ env.TERRAGRUNT_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: ${{ github.event_name }}-${{ github.run_id }}-${{ github.job }}
          aws-region: ca-central-1

      - run: just init ci
        env:
          # Avoids rate limiting for ruleset downloads
          GITHUB_TOKEN: ${{ github.token }}

  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false
      - uses: ./.github/actions/install-terragrunt
        with:
          version: ${{ env.TERRAGRUNT_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          role-session-name: ${{ github.event_name }}-${{ github.run_id }}-${{ github.job }}
          aws-region: ca-central-1

      - run: terragrunt run --all -- plan -lock=false
        env:
          TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
